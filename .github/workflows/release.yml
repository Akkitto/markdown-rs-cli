name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-24.04
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -Eeuo pipefail

          declare -r tag_name="${GITHUB_REF_NAME}"
          declare -r tag_version="${tag_name#v}"
          declare -r crate_version="$(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"

          if [[ "${tag_version}" != "${crate_version}" ]]; then
            echo "Tag version '${tag_version}' does not match Cargo.toml version '${crate_version}'." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify crate package
        run: cargo publish --dry-run --locked

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked
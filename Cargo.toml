[package]
name = "markdown-rs-cli"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Convert Markdown to markdown-rs mdast JSON."
repository = "https://github.com/Akkitto/markdown-rs-cli.git"
readme = "README.md"
keywords = ["markdown", "mdast", "cli", "json"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
markdown = { version = "1", features = ["serde"] }
mdast_util_to_markdown = "0.0.2"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"